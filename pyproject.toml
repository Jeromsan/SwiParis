[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swiparis"
version = "0.1.0"
description = "Import reproductible Foursquare vers SQLite"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
swiparis-import = "swiparis.import_foursquare:main"

[tool.setuptools.packages.find]
where = ["src"]
