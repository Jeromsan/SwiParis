[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swiparis"
version = "0.1.0"
description = "Collecte reproductible Foursquare et Paris Data vers SQLite"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
swiparis-import = "swiparis.import_foursquare:main"
swiparis-paris-import = "swiparis.import_paris_data:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
swiparis = ["*.sql"]
